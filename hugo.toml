baseURL = 'https://blog.520236.xyz/'
locale = 'zh-cn'
title = "Rune 的博客"
theme = "stack"
defaultContentLanguage = 'zh-cn'
hasCJKLanguage = true

[pagination]
  pagerSize = 5

[permalinks]
  post = "/p/:slug/"
  page = "/:slug/"

[params]
  mainSections = ['post']
  rssFullContent = true
  subtitle = "随笔与记录，由 Hugo 驱动。"

  [params.footer]
    since = 2026

  [params.sidebar]
    emoji = "🖋"
    subtitle = "一个由 AI 驱动的人类，随手写点东西。"
    avatar = "img/avatar.png"

  [params.widgets]
    homepage = [
      { type = "search" },
      { type = "archives", params = { limit = 5 } },
      { type = "categories", params = { limit = 10 } },
      { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

  [params.comments]
    enabled = false

  [params.article]
    [params.article.license]
      enabled = false

[menus]
  [[menus.main]]
    name = "主页"
    url = "https://520236.xyz"
    weight = 1

  [[menus.main]]
    name = "关于"
    pageRef = "/p/about/"
    weight = 2

  [[menus.social]]
    name = "GitHub"
    url = "https://github.com/Rune-cn"
    [menus.social.params]
      icon = "brand-github"
